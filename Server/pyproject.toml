[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steerlab-server"
version = "0.9.1"
description = "PyTorch/HF parallel to SteerLab's MLX steering engine, for remote-cluster activation-steering experiments."
readme = "README.md"
requires-python = ">=3.10"
# Concept-agnostic steering core + experiment orchestration + a thin HTTP service.
# Mirrors the on-disk artifact contracts of the Swift/MLX app so vectors,
# manifests, and run directories interoperate. See README.md.
#
# TWO ROLES, ONE DISTRIBUTION (Phase 1b of the portability program). The
# package ships two console scripts and they need different amounts of
# machinery:
#
#   * `steerlab`        — the CLIENT. Authors a local workspace: manifests,
#                         pins, conditions, concepts, bundles. No model, no
#                         GPU, no HTTP service. Runs anywhere Python does.
#   * `steerlab-server` — the ENGINE. Loads models and executes; serves the
#                         API. Needs the whole science stack.
#
# `dependencies` below is therefore the CLIENT's set — what a bare
# `pip install steerlab-server` must resolve — and the engine's stack lives
# behind the `runner` extra. That split is enforced, not merely intended:
# `tests/test_client_cli.py::test_importing_the_client_pulls_no_heavy_dependency`
# asserts out of process that importing `steerlab_server.client_cli` (and
# running `--help`) imports none of torch/transformers/fastapi/uvicorn/peft/
# sae_lens.
#
# WHAT IS IN THE CLIENT SET AND WHY. All three are real imports on a client
# path, measured rather than assumed: `numpy` (vector math in `steering`,
# reached through `experiment_store`'s import graph), `safetensors`
# (`steering.vector_store` reads/writes the artifact format a pinned-artifact
# attach hashes), and — since Phase 2 — `httpx`, the HTTP client behind
# `steerlab_server.client.runner` (the `runner` verb family: upload a bundle,
# submit it, read jobs and logs, bring verified evidence home). All three are
# pure wheels: no compiler, no CUDA.
#
# `httpx` COSTS THE RESOLUTION NOTHING. It and its whole closure (httpcore,
# h11, anyio, sniffio, certifi, idna) are ALREADY pinned in both committed
# platform locks — pulled in by `huggingface_hub` — at the same version this
# floor admits, so `uv pip compile --extra all` resolves the same package set
# it resolved before. Declaring it here only stops the client's HTTP stack
# from being an accident of somebody else's dependency tree.
#
# It is imported LAZILY, inside the runner verbs, never at `client_cli` import
# time: `--help` and every authoring verb still pull nothing third-party at
# all (tests/test_client_cli.py::test_importing_the_client_pulls_no_heavy_dependency).
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
# THE ENGINE'S STACK. Everything only EXECUTION needs: model loading and
# inference (torch/transformers/accelerate/huggingface_hub) and the HTTP
# service (fastapi/uvicorn/pydantic). Every install path that runs verbs
# installs this — directly, or through `all`, or from a committed lock
# (which is compiled with `--extra all`, so its resolution is unchanged by
# this split). See Server/README.md "Install roles".
#
# Do NOT fold these back into `dependencies` to "simplify": the whole point is
# that a client install of the package is a ~30 MB wheel set instead of a
# multi-gigabyte one, on a machine that may have no GPU at all.
runner = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
    "huggingface_hub>=0.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]
# Heavy/risky parity pieces (Phase 3) and the test suite are split out so the
# pure-CPU core can be installed and tested without dragging in everything.
lora = ["peft>=0.11", "pypdf>=4.2"]
# Needed only for Gemma Scope SAE ANALYSIS (experiment/gemma_scope.py analyze);
# the module imports without it and everything else runs sae-lens-free.
gemmascope = ["sae-lens>=5.0"]
# Anthropic's Jacobian-lens reference package, pinned by COMMIT: it is not
# published on PyPI, so the only stable identity is the git sha. The J-lens
# backend imports it lazily and tests run against a stub, so the server
# installs and runs fine without this extra.
#
# DELIBERATELY NOT IN `all`, unlike every other extra. Two reasons, both about
# not changing a node's substrate as a side effect of a routine bootstrap:
#   1. jlens floors transformers>=5.5, while this server's own floor is >=4.44.
#      Folding it into `all` would silently raise the effective floor on every
#      bootstrapped node, including re-bootstraps of nodes with studies in
#      flight.
#   2. It installs from a git URL, so it needs github.com egress — a network
#      requirement the other extras do not impose.
# Opt in explicitly: `bootstrap.sh --with-jlens`, or pip install -e
# "Server[jlens]". See docs/GEMMA3-27B-JLENS-VECTORS-AND-ONLINE-READOUT-PLAN.md
# §11.0.
jlens = [
    "jlens @ git+https://github.com/anthropics/jacobian-lens@581d398613e5602a5af361e1c34d3a92ea82ba8e",
]
test = ["pytest>=8.0"]
# Dev-only TOOLING, never a runtime dependency and deliberately not in `all`:
# `uv` is the resolver that generates the committed per-platform locks
# (requirements-macos-arm64.lock / requirements-linux-x86_64.lock) via
# Server/scripts/update-locks.sh. A cluster node never needs it — it INSTALLS
# from the locks, it does not produce them. Range-pinned because the resolver
# is part of the lock's provenance: a different major could resolve differently
# from the same pyproject.
dev = ["uv>=0.12.5,<0.13"]
# `all` = runner + lora + gemmascope + test, spelled out rather than referenced
# so `uv pip compile --extra all` (Server/scripts/update-locks.sh) and every
# `pip install -e "Server[all]"` in bootstrap.sh / ONBOARDING / README resolve
# the SAME package set they resolved before the client/runner split. That
# invariant is the reason the split could land without touching the committed
# locks or the app's Local Engine flow.
all = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
    "huggingface_hub>=0.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "peft>=0.11", "pypdf>=4.2", "sae-lens>=5.0", "pytest>=8.0",
]

# NOTE ON FLOORS vs LOCKS (WP6 R1, 2026-08-18). The `dependencies` above are
# FLOORS — the right contract for a library, the wrong one for an instrument:
# two sites can satisfy them with different torch/transformers and produce
# different numbers. The exact-version contract lives in the two committed
# platform locks; every run's config.json then stamps the versions that were
# ACTUALLY imported (`pythonEnvironment`), so a reader checks the record rather
# than trusting the lock was honored. Do not tighten these floors to "fix"
# reproducibility — that is the locks' job, and floors that move break
# already-provisioned nodes.

[project.scripts]
# The ENGINE's command line — unchanged, including its Mac-authority authoring
# refusals. A cluster node drives this one.
steerlab-server = "steerlab_server.cli:main"
# The CLIENT's command line (Phase 1b): authors a local workspace on any
# platform, runs nothing, talks to no runner. Installing this package now
# CLAIMS the `steerlab` name — anyone carrying the temporary
# `~/.local/bin/steerlab` symlink to the Swift CLI should drop it (AGENTS.md
# step 1 calls that alias temporary and reserved for exactly this).
steerlab = "steerlab_server.client_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["steerlab_server*"]

[tool.setuptools.package-data]
"steerlab_server.api" = ["static/*"]
# The qualification prompt fixtures ship with the ENGINE, not the workspace:
# `jlens qualify` is an instrument self-test, and inputs that varied per
# workspace would make two workspaces' qualifications incomparable.
"steerlab_server.jlens" = ["fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
