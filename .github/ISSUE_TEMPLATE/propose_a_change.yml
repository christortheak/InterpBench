name: Propose a change
description: Suggest a new capability, or a change to how SteerLab works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public.** Describe your study in general terms, and never paste a token, a password, a folder path, or study data.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what made it hard or impossible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The change you have in mind, and who it would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else
      description: Other approaches you considered, or work you know of that does something similar.
    validations:
      required: false
